schema_version: "1.0"
experiment_id: seven_llm_round_robin_3x_1903

dry_run: false
agent_state_mode: fresh

agents:
  - blueprints/cassandra.yaml
  - blueprints/dorian.yaml
  - blueprints/marcellus.yaml
  - blueprints/seraphine.yaml
  - blueprints/helena.yaml
  - blueprints/victor.yaml
  - blueprints/selene.yaml

runtime:
  kind: baseline_llm
  provider: openai_compatible
  max_ticks: 1
  llm_agent_ids:
    - cassandra
    - dorian
    - marcellus
    - seraphine
    - helena
    - victor
    - selene
  provider_config:
    kind: openai_compatible
    model: gpt-4.1-mini
    temperature: 0.2
    max_output_tokens: 400
    timeout_seconds: 60
    pricing:
      input_cost_per_1k_tokens: 0.0003
      output_cost_per_1k_tokens: 0.0012

games:
  count: 3
  max_year: 1903
  country_assignment: round_robin
  seed: 1903

budget:
  max_provider_calls: 750
  max_input_tokens: 1800000
  max_output_tokens: 180000
  max_estimated_cost_usd: 3.00
  stop_policy: stop_game_after_phase

outputs:
  observatory: true
  summary: true