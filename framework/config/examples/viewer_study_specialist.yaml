schema_version: "1.0"
experiment_id: d-special
agent_state_mode: fresh
dry_run: false

# Compound roster intervention: seven named specialist blueprints.
agents:
  - agent_id: a0
    blueprint: blueprints/atlas.yaml
    provider_config: {kind: fake, model: offline-study-fake}
  - agent_id: a1
    blueprint: blueprints/dorian.yaml
    provider_config: {kind: fake, model: offline-study-fake}
  - agent_id: a2
    blueprint: blueprints/helena.yaml
    provider_config: {kind: fake, model: offline-study-fake}
  - agent_id: a3
    blueprint: blueprints/iris.yaml
    provider_config: {kind: fake, model: offline-study-fake}
  - agent_id: a4
    blueprint: blueprints/metternich.yaml
    provider_config: {kind: fake, model: offline-study-fake}
  - agent_id: a5
    blueprint: blueprints/selene.yaml
    provider_config: {kind: fake, model: offline-study-fake}
  - agent_id: a6
    blueprint: blueprints/shaver.yaml
    provider_config: {kind: fake, model: offline-study-fake}

runtime:
  kind: baseline_llm
  provider: fake
  max_ticks: 1
  llm_agent_ids: [a0, a1, a2, a3, a4, a5, a6]

games:
  count: 1
  max_year: 1901
  country_assignment: fixed
  seed: 20261016

budget:
  max_provider_calls: 200
  stop_policy: stop_experiment

outputs:
  observatory: true
  summary: true
