schema_version: "1.0"
experiment_id: seven_llm_grok_1901_smoke

dry_run: false
agent_state_mode: fresh

agents:
  - blueprints/cassandra.yaml
  - blueprints/dorian.yaml
  - blueprints/marcellus.yaml
  - blueprints/seraphine.yaml
  - blueprints/helena.yaml
  - blueprints/victor.yaml
  - blueprints/selene.yaml

runtime:
  kind: baseline_llm
  max_ticks: 1
  llm_agent_ids:
    - cassandra
    - dorian
    - marcellus
    - seraphine
    - helena
    - victor
    - selene
  provider_config:
    model_profile: xai_grok_4_5
    reasoning_effort: low
    max_output_tokens: 700
    timeout_seconds: 90

games:
  count: 1
  max_year: 1901
  country_assignment: fixed
  seed: 2030

budget:
  max_provider_calls: 120
  max_input_tokens: 100000
  max_output_tokens: 25000
  max_estimated_cost_usd: 5.0
  stop_policy: stop_experiment

outputs:
  observatory: true
  summary: true
